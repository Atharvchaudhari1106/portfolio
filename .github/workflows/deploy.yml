name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Portfolio (Flask-Frozen) ──────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        working-directory: portfolio
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build portfolio with Flask-Frozen
        working-directory: portfolio
        run: python freeze.py

      # ── Big Data Search App (Vite/React) ──────────────────
      - name: Install big data search dependencies
        run: npm install
        working-directory: "my works/bigdata-search/frontend"

      - name: Build big data search app
        run: npm run build
        working-directory: "my works/bigdata-search/frontend"

      - name: Copy big data search app into portfolio build
        run: |
          mkdir -p portfolio/build/bigdata
          cp -r "my works/bigdata-search/frontend/dist"/* portfolio/build/bigdata/

      # ── CrimeGPT App (Vite/React) ──────────────────
      - name: Checkout CrimeGPT
        uses: actions/checkout@v4
        with:
          repository: atharv9727-debug/crimegpt
          path: crimegpt

      - name: Update CrimeGPT base path to relative
        run: |
          sed -i "s|base: '/crimegpt/'|base: './'|g" crimegpt/crimegpt-frontend/vite.config.js

      - name: Install CrimeGPT dependencies
        run: npm install
        working-directory: crimegpt/crimegpt-frontend

      - name: Build CrimeGPT app
        run: npm run build
        working-directory: crimegpt/crimegpt-frontend

      - name: Copy CrimeGPT into portfolio build
        run: |
          mkdir -p portfolio/build/crimegpt
          cp -r crimegpt/crimegpt-frontend/dist/* portfolio/build/crimegpt/

      # ── Upload artifact ──────────────────────────────
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./portfolio/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
